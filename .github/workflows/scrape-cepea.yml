name: Scrape CEPEA cotações

# Roda em volta do horário em que o CEPEA publica, seg-sex.
#
# Antes rodava a cada 30 minutos das 8h às 19h BRT, 24 vezes por dia. Medindo o
# histórico (300 commits), 96% deles não mudavam nenhum preço, e as mudanças
# reais aconteciam às 19h BRT em 9 de 11 vezes. Ou seja: 23 das 24 execuções
# diárias existiam para nada, e o empilhamento no grupo de concorrência era o
# que gerava os e-mails de "All jobs were cancelled".
#
# Agora: seis passadas cobrindo 18h-20h30 BRT, mais uma de manhã para pegar
# eventual correção publicada fora do horário. Sete em vez de 24.
on:
  schedule:
    # 21h00 a 23h30 UTC, de meia em meia hora = 18h00 a 20h30 BRT
    - cron: '0,30 21-23 * * 1-5'
    # 13h05 UTC = 10h05 BRT, rede de segurança para correção tardia
    - cron: '5 13 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write   # pra commitar data/cotacoes.json

concurrency:
  group: scrape-cepea
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape CEPEA (basico + completo)
        run: python tools/scrape_cepea.py --set all

      - name: Commit + push se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cotacoes.json data/cotacoes-completas.json data/cotacoes-historico.json
          if git diff --staged --quiet; then
            echo "Sem mudanças nos preços — skip commit."
          else
            git commit -m "cotacoes: atualiza CEPEA spot ($(TZ='America/Sao_Paulo' date +%Y-%m-%d_%Hh%M))"
            # Retry robusto: em falha de push (500 do GitHub ou corrida com
            # outro job) realinhamos com origin/main e RE-EXECUTAMOS o produtor
            # sobre o estado remoto. Rebase nao serve: conflita nos arquivos
            # gerados e deixa o repo em detached HEAD (falha de 2026-08-17).
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "push falhou apos 3 tentativas"; exit 1; fi
              echo "push falhou (tentativa $n/3) - realinhando com origin/main"
              sleep 15
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              git checkout -B main 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              python tools/scrape_cepea.py --set all
              git add data/cotacoes.json data/cotacoes-completas.json data/cotacoes-historico.json
              if git diff --cached --quiet; then
                echo "Nada a enviar apos realinhar - remoto ja atualizado."
                exit 0
              fi
              git commit -m "cotacoes: atualiza CEPEA spot ($(TZ='America/Sao_Paulo' date +%Y-%m-%d_%Hh%M))"
            done
          fi
